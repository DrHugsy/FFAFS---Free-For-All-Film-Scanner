<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lite Photo Editor — Dr Iggy's</title>
<meta name="description" content="A free, lightweight photo editor for quick crops, color adjustments and touch-ups — coming soon from Dr Iggy's.">
<link rel="canonical" href="https://www.driggys.com/photo-editor.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%234C2E9E'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' text-anchor='middle' fill='white' font-family='Tahoma,sans-serif'%3EI%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --violet-1:#A88CF0; --violet-2:#7452D6; --violet-3:#4C2E9E;
    --titlebar-1:#3E7BEB; --titlebar-2:#1E4FC4; --titlebar-3:#0F3AA8;
    --window:#ECE9D8; --window-edge:#0A246A; --ink:#000000; --ink-dim:#4B4B4B;
    --font:Tahoma, 'Segoe UI', Verdana, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; background:#6E9DDD; }
  body{
    margin:0; font-family:var(--font); font-size:12.5px; color:var(--ink);
    min-height:100vh; padding:14px; position:relative;
  }
  .bg-scene{ position:fixed; inset:0; width:100%; height:100%; }

  .win{
    background:var(--window); border:2px solid var(--window-edge); border-radius:7px 7px 3px 3px;
    box-shadow:2px 3px 8px rgba(0,0,0,.4);
  }
  .win-title{
    background:linear-gradient(180deg, var(--titlebar-1) 0%, var(--titlebar-2) 45%, var(--titlebar-2) 60%, var(--titlebar-3) 100%);
    color:#fff; font-weight:bold; font-size:13px; padding:4px 6px 4px 10px; border-radius:5px 5px 0 0;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    text-shadow:1px 1px 1px rgba(0,0,0,.45);
  }
  .win-title .capbtns{ display:flex; gap:3px; }
  .win-title .capbtns span{
    width:19px; height:17px; border-radius:3px; display:inline-flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:bold; color:#333333; text-shadow:none; cursor:pointer;
    background:linear-gradient(180deg,#FFFFFF 0%,#ECECEC 45%,#D9D9D9 55%,#C4C4C4 100%); border:1px solid #7A7A7A;
  }
  .win-title .capbtns span:hover{ background:linear-gradient(180deg,#FFFFFF 0%,#EAF2FF 45%,#D6E6FF 55%,#BFDAFF 100%); border-color:#316AC5; }
  .win-title .capbtns span:active{ background:linear-gradient(180deg,#C4C4C4,#D9D9D9); }

  .dev-taskbar{
    background:linear-gradient(180deg, var(--violet-1) 0%, var(--violet-2) 50%, var(--violet-3) 100%);
    border:2px solid #2E1A66; border-radius:6px; padding:5px 12px;
    display:flex; align-items:center; justify-content:space-between;
    color:#fff; font-weight:bold; font-size:12px; text-shadow:1px 1px 1px rgba(0,0,0,.4);
  }
  .dev-taskbar .more-tools{
    color:#fff; text-decoration:none; background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.5); border-radius:4px; padding:3px 10px; font-size:11.5px;
  }
  .dev-taskbar .more-tools:hover{ background:rgba(255,255,255,.32); }

  .page{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:14px; position:relative; z-index:1; }

  .win-body{ padding:34px 26px; text-align:center; }
  .win-body .icon{ margin-bottom:14px; }
  .win-body h1{ font-size:20px; margin:0 0 8px; color:#0F3AA8; }
  .win-body p{ margin:0 0 4px; color:var(--ink-dim); font-size:12.5px; line-height:1.5; }
  .tag{
    display:inline-block; margin-top:14px; font-size:10px; font-weight:bold; letter-spacing:.5px;
    color:#fff; background:#8B8B8B; border-radius:3px; padding:3px 10px;
  }
</style>
</head>
<body>

<svg class="bg-scene" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E5FC2"/>
      <stop offset="45%" stop-color="#5C93DE"/>
      <stop offset="100%" stop-color="#D9EAF6"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FD37A"/>
      <stop offset="55%" stop-color="#4F9E48"/>
      <stop offset="100%" stop-color="#286B2C"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9E793"/>
      <stop offset="55%" stop-color="#69B856"/>
      <stop offset="100%" stop-color="#3D8B3F"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity="0.8">
    <ellipse cx="16" cy="16" rx="8" ry="3.2"/><ellipse cx="21" cy="14" rx="6" ry="2.6"/><ellipse cx="11" cy="14.5" rx="5" ry="2.3"/>
    <ellipse cx="72" cy="9" rx="7" ry="2.8"/><ellipse cx="77" cy="7.5" rx="5" ry="2.2"/><ellipse cx="67" cy="8" rx="4.5" ry="2"/>
  </g>
  <path d="M0,62 Q15,48 32,60 T65,58 T100,55 L100,100 L0,100 Z" fill="url(#hillBack)"/>
  <path d="M0,78 Q20,62 40,76 T78,74 T100,70 L100,100 L0,100 Z" fill="url(#hillFront)"/>
</svg>

<div class="page">

  <div class="dev-taskbar">
    <span>Dr Iggy's</span>
    <a class="more-tools" href="index.html">&#8592; More Tools</a>
  </div>

  <div class="win">
    <div class="win-title">
      <span>Lite Photo Editor</span>
      <div class="capbtns">
        <span id="btnMin" title="Minimize">_</span>
        <span id="btnMax" title="Fullscreen">&#9633;</span>
        <span title="Close">&#215;</span>
      </div>
    </div>
    <div class="win-body">
      <svg class="icon" width="72" height="72" viewBox="0 0 56 56">
        <rect x="5" y="7" width="46" height="34" rx="3" fill="#fff" stroke="#0A246A" stroke-width="2"/>
        <path d="M9 35 L20 22 L27 30 L36 18 L47 35 Z" fill="#7FCB68"/>
        <circle cx="17" cy="16" r="3.5" fill="#FCEAA8"/>
        <g stroke="#0F3AA8" stroke-width="2" stroke-linecap="round">
          <line x1="8" y1="47" x2="20" y2="47"/><circle cx="16" cy="47" r="2.6" fill="#fff"/>
          <line x1="24" y1="47" x2="36" y2="47"/><circle cx="30" cy="47" r="2.6" fill="#fff"/>
          <line x1="40" y1="47" x2="50" y2="47"/><circle cx="44" cy="47" r="2.6" fill="#fff"/>
        </g>
      </svg>
      <h1>Lite Photo Editor</h1>
      <p>A free, lightweight photo editor for quick crops, color adjustments and touch-ups —</p>
      <p>right in your browser, no signup.</p>
      <span class="tag">Coming soon — in development</span>
    </div>
  </div>

</div>

<script>
document.getElementById('btnMin').addEventListener('click', ()=>{
  document.exitFullscreen?.().catch(()=>{});
});
document.getElementById('btnMax').addEventListener('click', ()=>{
  document.documentElement.requestFullscreen?.().catch(()=>{});
});
</script>

</body>
</html>
