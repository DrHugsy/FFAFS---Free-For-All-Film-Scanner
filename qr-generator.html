<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — Dr Iggy's</title>
<meta name="description" content="Free QR code generator: turn any link or text into a QR code, style it, add your own logo in the center, and download it as PNG or SVG — right in your browser, no signup.">
<link rel="canonical" href="https://www.driggys.com/qr-generator">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='0' fill='%23000'/%3E%3Ccircle cx='12' cy='15' r='2.4' fill='%23fff'/%3E%3Ccircle cx='20' cy='15' r='2.4' fill='%23fff'/%3E%3Cpath d='M11 21 Q16 25 21 21' stroke='%23fff' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cascadia+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
<style>
  :root{
    --font-display:'Cascadia Mono','Consolas',monospace;
    --font-body:'Cascadia Mono','Consolas',monospace;

    --bg:#000000; --surface:#0E0E0E; --surface-2:#1A1A1A; --surface-3:#242424;
    --border:rgba(255,255,255,.14); --border-strong:rgba(255,255,255,.32);
    --text:#F2F2F2; --text-dim:#9A9A9A; --text-faint:#5C5C5C;
    --accent:#FFB74D;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:13px; min-height:100vh; position:relative; overflow-x:hidden;
  }
  h1{ font-family:var(--font-display); margin:0; }

  .page{ max-width:1100px; margin:0 auto; padding:14px 20px 60px; }

  .nav{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; margin-bottom:6px; }
  .nav-left{ display:flex; align-items:center; gap:12px; position:relative; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand svg{ width:28px; height:28px; flex:none; }
  .brand span{ font-family:var(--font-display); font-weight:600; font-size:16px; color:var(--text); }
  .hamburger{
    width:34px; height:34px; padding:0; background:var(--surface); flex:none;
    border:1px solid var(--border); color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; min-height:auto; transition:border-color .12s ease, transform .08s ease;
  }
  .hamburger svg{ width:16px; height:16px; }
  .hamburger:hover{ border-color:var(--border-strong); }
  .hamburger:active{ transform:scale(.9); }
  .menu-backdrop{ position:fixed; inset:0; z-index:40; display:none; }
  .menu-backdrop.open{ display:block; }
  .nav-menu{
    position:absolute; top:calc(100% + 8px); left:0; min-width:210px; background:var(--surface);
    border:1px solid var(--border-strong); border-top:3px solid #fff; z-index:50;
    display:none; flex-direction:column; padding:6px;
  }
  .nav-menu.open{ display:flex; }
  .nav-menu a{
    display:flex; align-items:center; gap:9px; padding:9px 10px; text-decoration:none; color:var(--text-dim);
    font-size:12.5px; font-weight:600; transition:background .1s ease, color .1s ease;
  }
  .nav-menu a:hover{ background:var(--surface-2); color:var(--text); }
  .nav-menu a:active{ transform:scale(.98); }
  .nav-menu a.current{ color:#000; background:#fff; }
  .nav-menu .menu-sep{ height:1px; background:var(--border); margin:5px 2px; }
  .nav-right{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    width:34px; height:34px; padding:0; background:var(--surface);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center; min-height:auto;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .lang-toggle{ display:flex; background:var(--surface); border:1px solid var(--border); padding:3px; gap:2px; }
  .lang-toggle button{
    border:none; background:none; color:var(--text-dim); font-family:var(--font-body); font-weight:600;
    font-size:12px; padding:6px 13px; cursor:pointer; min-height:auto;
  }
  .lang-toggle button.active{ background:#fff; color:#000; }

  .win{ background:var(--surface); border:1px solid var(--border); }
  .win-title{
    font-family:var(--font-display); font-weight:600; color:var(--text); font-size:14px;
    padding:14px 18px; border-bottom:1px solid var(--border);
  }

  .layout{ display:grid; grid-template-columns:380px 1fr; gap:10px; align-items:start; }

  .toolbar{ padding:16px; display:flex; flex-direction:column; gap:14px; }

  label.field{ display:flex; flex-direction:column; gap:6px; font-size:11.5px; color:var(--text-dim); }
  input[type=text]{
    font-family:var(--font-body); font-size:12.5px; color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); padding:9px 10px; width:100%;
  }
  input[type=text]:focus{ outline:none; border-color:var(--border-strong); }
  .url-row{ display:flex; gap:6px; }
  .url-row input{ flex:1; }

  button{
    font-family:var(--font-body); font-weight:600; font-size:12px; padding:8px 14px; min-height:auto;
    border:1px solid var(--border); color:var(--text); cursor:pointer;
    background:var(--surface-2); display:inline-flex; align-items:center; gap:7px;
  }
  button:hover{ border-color:var(--border-strong); background:var(--surface-3); }
  button:active{ transform:scale(.97); }
  button.primary{ background:#fff; border-color:transparent; color:#000; }
  button.primary:hover{ background:#e2e2e2; }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button .ic{ width:15px; height:15px; flex:none; }
  input[type=file]{ display:none; }

  .format-picker{ display:flex; flex-wrap:wrap; gap:6px; }
  .format-btn{
    padding:7px 12px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim);
    font-family:var(--font-body); font-weight:600; font-size:11.5px; cursor:pointer;
  }
  .format-btn:hover{ border-color:var(--border-strong); color:var(--text); }
  .format-btn.active{ background:#fff; color:#000; border-color:transparent; }

  .color-row{ display:flex; gap:10px; }
  .color-field{ display:flex; align-items:center; gap:8px; flex:1; border:1px solid var(--border); background:var(--surface-2); padding:6px 10px; }
  .color-field span{ font-size:11.5px; color:var(--text-dim); flex:1; }
  input[type=color]{
    -webkit-appearance:none; appearance:none; width:26px; height:26px; padding:0; border:1px solid var(--border);
    background:none; cursor:pointer; flex:none;
  }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:0; }
  input[type=color]::-webkit-color-swatch{ border:none; }

  .logo-row{ display:flex; align-items:center; gap:8px; }
  .logo-row .logo-thumb{
    width:34px; height:34px; flex:none; object-fit:cover; border:1px solid var(--border);
    background:repeating-conic-gradient(#1c1c1c 0% 25%, #141414 0% 50%) 50% / 10px 10px; display:none;
  }

  .note{ font-size:11px; color:var(--text-faint); line-height:1.5; }

  .preview-pane{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; gap:18px; min-height:420px; }
  #qrHolder{ background:#fff; padding:16px; line-height:0; }
  #qrHolder canvas, #qrHolder svg{ display:block; }
  .dl-row{ display:flex; gap:8px; }
  .qr-empty{ color:var(--text-faint); font-size:12.5px; text-align:center; max-width:280px; }

  .site-footer{ text-align:center; font-size:12px; color:var(--text-faint); padding:20px 0 6px; }
  .site-footer a{ color:var(--text-dim); text-decoration:underline; text-underline-offset:2px; }

  @media (max-width:800px){
    .layout{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="nav">
    <div class="nav-left">
      <button class="hamburger" id="btnMenu" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <a class="brand" href="/">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="0" fill="#000" stroke="#fff" stroke-opacity=".2"/>
          <circle cx="12" cy="15" r="2.4" fill="#fff"/>
          <circle cx="20" cy="15" r="2.4" fill="#fff"/>
          <path d="M11 21 Q16 25 21 21" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        </svg>
        <span>Dr Iggy's</span>
      </a>
      <div class="menu-backdrop" id="menuBackdrop"></div>
      <div class="nav-menu" id="navMenu">
        <a href="/">Home</a>
        <div class="menu-sep"></div>
        <a href="/film-scanner">Film Scanner</a>
        <a href="/photo-editor">Photo Editor</a>
        <a href="/lut-lab">LUT Lab</a>
        <a href="/convert">Image Converter</a>
        <a href="/favicon-generator">Favicon Generator</a>
        <a href="/qr-generator" class="current">QR Generator</a>
        <div class="menu-sep"></div>
        <a href="/terms">Terms of Service</a>
      </div>
    </div>
    <div class="nav-right">
      <button class="icon-btn" id="btnFullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <div class="lang-toggle">
        <button id="btnLangEn">EN</button>
        <button id="btnLangEs">ES</button>
      </div>
    </div>
  </div>

  <div class="layout">

    <div class="win">
      <div class="win-title" data-i18n="winTitle">QR Code Generator</div>
      <div class="toolbar">

        <label class="field">
          <span data-i18n="contentLabel">Link or text to encode</span>
          <div class="url-row">
            <input type="text" id="qrData" spellcheck="false">
            <button id="btnUseSite" title="driggys.com">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg>
            </button>
          </div>
          <span class="note" data-i18n="contentHint">Any URL, plain text, Wi-Fi string, vCard… whatever you paste gets encoded.</span>
        </label>

        <div>
          <span class="note" style="display:block;margin-bottom:6px"><b data-i18n="styleLabel">Dot style</b></span>
          <div class="format-picker" id="stylePicker"></div>
        </div>

        <div class="color-row">
          <label class="color-field">
            <input type="color" id="dotColor" value="#000000">
            <span data-i18n="dotColor">Dots</span>
          </label>
          <label class="color-field">
            <input type="color" id="bgColor" value="#ffffff">
            <span data-i18n="bgColor">Background</span>
          </label>
        </div>

        <label class="field">
          <span data-i18n="logoLabel">Logo (optional)</span>
          <div class="logo-row">
            <img class="logo-thumb" id="logoThumb" alt="">
            <button id="btnAddLogo">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7 8l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
              <span data-i18n="chooseLogo">Choose image</span>
            </button>
            <button id="btnRemoveLogo" style="display:none">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <input type="file" id="logoInput" accept=".jpg,.jpeg,.png,.webp,.svg">
        </label>

        <p class="note" data-i18n="privacyNote">Everything happens in your browser — the text/link you enter is never sent anywhere.</p>
      </div>
    </div>

    <div class="win">
      <div class="win-title" data-i18n="preview">Preview</div>
      <div class="preview-pane">
        <div id="qrHolder"></div>
        <div class="dl-row">
          <button class="primary" id="btnDownloadPng" disabled>
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"/></svg>
            <span data-i18n="downloadPng">Download PNG</span>
          </button>
          <button id="btnDownloadSvg" disabled>
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"/></svg>
            <span data-i18n="downloadSvg">Download SVG</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <div class="site-footer">
    © 2026 QR Code Generator — Dr Iggy's. <a href="/terms" data-i18n="terms">Terms of Service</a>.
  </div>

</div>

<script>
const I18N = {
  en:{
    winTitle:'QR Code Generator', contentLabel:'Link or text to encode',
    contentHint:'Any URL, plain text, Wi-Fi string, vCard… whatever you paste gets encoded.',
    styleLabel:'Dot style', dotColor:'Dots', bgColor:'Background',
    logoLabel:'Logo (optional)', chooseLogo:'Choose image',
    privacyNote:'Everything happens in your browser — the text/link you enter is never sent anywhere.',
    preview:'Preview', downloadPng:'Download PNG', downloadSvg:'Download SVG', terms:'Terms of Service',
    styleSquare:'Square', styleDots:'Dots', styleRounded:'Rounded', styleClassy:'Classy',
    openFailAlert:'Could not read that image.',
  },
  es:{
    winTitle:'Generador de Códigos QR', contentLabel:'Link o texto a codificar',
    contentHint:'Una URL, texto plano, red Wi-Fi, vCard… lo que pegues se codifica.',
    styleLabel:'Estilo de puntos', dotColor:'Puntos', bgColor:'Fondo',
    logoLabel:'Logo (opcional)', chooseLogo:'Elegir imagen',
    privacyNote:'Todo pasa en tu navegador — el texto/link que pongas nunca se envía a ningún lado.',
    preview:'Vista previa', downloadPng:'Descargar PNG', downloadSvg:'Descargar SVG', terms:'Términos de servicio',
    styleSquare:'Cuadrado', styleDots:'Puntos', styleRounded:'Redondeado', styleClassy:'Clásico',
    openFailAlert:'No pude leer esa imagen.',
  }
};
const LANG_KEY = 'drIggyLang';
let LANG = (function(){ try{ return localStorage.getItem(LANG_KEY) || 'en'; }catch(e){ return 'en'; } })();
function t(key){ return (I18N[LANG] && I18N[LANG][key]) || key; }
function setLanguage(lang){ LANG = lang; try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){} applyLanguage(); }
function applyLanguage(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(I18N[LANG][key] !== undefined) el.textContent = I18N[LANG][key];
  });
  document.getElementById('btnLangEn').classList.toggle('active', LANG==='en');
  document.getElementById('btnLangEs').classList.toggle('active', LANG==='es');
  document.documentElement.lang = LANG;
  buildStylePicker();
}
document.getElementById('btnLangEn').addEventListener('click', ()=> setLanguage('en'));
document.getElementById('btnLangEs').addEventListener('click', ()=> setLanguage('es'));
document.getElementById('btnFullscreen').addEventListener('click', ()=>{
  if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  else document.documentElement.requestFullscreen?.().catch(()=>{});
});
const btnMenu = document.getElementById('btnMenu');
const navMenu = document.getElementById('navMenu');
const menuBackdrop = document.getElementById('menuBackdrop');
function toggleMenu(open){
  const willOpen = open !== undefined ? open : !navMenu.classList.contains('open');
  navMenu.classList.toggle('open', willOpen);
  menuBackdrop.classList.toggle('open', willOpen);
  btnMenu.setAttribute('aria-expanded', String(willOpen));
}
btnMenu.addEventListener('click', ()=> toggleMenu());
menuBackdrop.addEventListener('click', ()=> toggleMenu(false));
document.addEventListener('keydown', e=>{ if(e.key==='Escape') toggleMenu(false); });

// ---------------- style picker ----------------
let dotStyle = 'square';
function buildStylePicker(){
  const wrap = document.getElementById('stylePicker');
  wrap.innerHTML = '';
  [['square', t('styleSquare')], ['dots', t('styleDots')], ['rounded', t('styleRounded')], ['classy', t('styleClassy')]].forEach(([id,label])=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'format-btn' + (dotStyle===id ? ' active' : '');
    b.textContent = label;
    b.addEventListener('click', ()=>{ dotStyle = id; buildStylePicker(); scheduleUpdate(); });
    wrap.appendChild(b);
  });
}

// ---------------- QR instance ----------------
const DEFAULT_URL = 'https://www.driggys.com';
let logoDataUrl = null;
let qr = null;

function currentOptions(){
  const data = document.getElementById('qrData').value.trim();
  return {
    width: 320, height: 320, type: 'canvas',
    data: data || DEFAULT_URL,
    margin: 8,
    qrOptions: { errorCorrectionLevel: logoDataUrl ? 'H' : 'M' },
    dotsOptions: { type: dotStyle, color: document.getElementById('dotColor').value },
    backgroundOptions: { color: document.getElementById('bgColor').value },
    image: logoDataUrl || undefined,
    imageOptions: { crossOrigin: 'anonymous', margin: 6, imageSize: 0.34, hideBackgroundDots: true },
  };
}

function buildQr(){
  document.getElementById('qrHolder').innerHTML = '';
  qr = new QRCodeStyling(currentOptions());
  qr.append(document.getElementById('qrHolder'));
  document.getElementById('btnDownloadPng').disabled = false;
  document.getElementById('btnDownloadSvg').disabled = false;
}

let updateTimer = null;
function scheduleUpdate(){
  clearTimeout(updateTimer);
  updateTimer = setTimeout(()=>{
    if(!qr) return buildQr();
    qr.update(currentOptions());
  }, 150);
}

document.getElementById('qrData').addEventListener('input', scheduleUpdate);
document.getElementById('dotColor').addEventListener('input', scheduleUpdate);
document.getElementById('bgColor').addEventListener('input', scheduleUpdate);
document.getElementById('btnUseSite').addEventListener('click', ()=>{
  document.getElementById('qrData').value = DEFAULT_URL;
  scheduleUpdate();
});

// ---------------- logo upload ----------------
document.getElementById('btnAddLogo').addEventListener('click', ()=> document.getElementById('logoInput').click());
document.getElementById('logoInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    logoDataUrl = reader.result;
    const thumb = document.getElementById('logoThumb');
    thumb.src = logoDataUrl;
    thumb.style.display = 'block';
    document.getElementById('btnRemoveLogo').style.display = 'inline-flex';
    scheduleUpdate();
  };
  reader.onerror = ()=> alert(t('openFailAlert'));
  reader.readAsDataURL(file);
});
document.getElementById('btnRemoveLogo').addEventListener('click', ()=>{
  logoDataUrl = null;
  document.getElementById('logoInput').value = '';
  document.getElementById('logoThumb').style.display = 'none';
  document.getElementById('btnRemoveLogo').style.display = 'none';
  scheduleUpdate();
});

// ---------------- downloads ----------------
async function downloadAs(ext, mime){
  if(!qr) return;
  const blob = await qr.getRawData(ext);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'qr-code.' + ext; a.click();
  setTimeout(()=> URL.revokeObjectURL(url), 3000);
}
document.getElementById('btnDownloadPng').addEventListener('click', ()=> downloadAs('png'));
document.getElementById('btnDownloadSvg').addEventListener('click', ()=> downloadAs('svg'));

document.getElementById('qrData').value = DEFAULT_URL;
applyLanguage();
buildQr();
</script>

</body>
</html>
