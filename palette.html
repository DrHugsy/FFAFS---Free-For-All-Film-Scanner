<style>
  :root{
    --font-display:'Cascadia Mono','Consolas',monospace;
    --font-body:'Cascadia Mono','Consolas',monospace;

    --bg:#000000; --surface:#0E0E0E; --surface-2:#1A1A1A; --surface-3:#242424;
    --border:rgba(255,255,255,.14); --border-strong:rgba(255,255,255,.32);
    --text:#F2F2F2; --text-dim:#9A9A9A; --text-faint:#5C5C5C;
    --accent:#FFB74D; --accent-2:#FF8FA3;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:13px; min-height:100vh; position:relative; overflow-x:hidden;
  }
  h1{ font-family:var(--font-display); margin:0; }

  .page{ max-width:1100px; margin:0 auto; padding:14px 20px 60px; }

  .nav{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; margin-bottom:6px; }
  .nav-left{ display:flex; align-items:center; gap:12px; position:relative; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; padding:4px 8px; margin:-4px -8px; border-radius:8px; transition:background .15s ease; }
  .brand:hover{ background:var(--surface-2); }
  .brand:hover img{ transform:scale(1.08) rotate(-3deg); }
  .brand img{ width:28px; height:28px; flex:none; transition:transform .15s ease; }
  .brand span{ font-family:var(--font-display); font-weight:600; font-size:16px; color:var(--text); }
  .hamburger{
    width:34px; height:34px; padding:0; background:var(--surface); flex:none;
    border:1px solid var(--border); color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; min-height:auto; transition:border-color .12s ease, transform .08s ease;
  }
  .hamburger svg{ width:16px; height:16px; }
  .hamburger:hover{ border-color:var(--border-strong); }
  .hamburger:active{ transform:scale(.9); }
  .menu-backdrop{ position:fixed; inset:0; z-index:40; display:none; }
  .menu-backdrop.open{ display:block; }
  .nav-menu{
    position:absolute; top:calc(100% + 8px); left:0; min-width:210px; background:var(--surface);
    border:1px solid var(--border-strong); border-top:3px solid #fff; z-index:50;
    display:none; flex-direction:column; padding:6px;
  }
  .nav-menu.open{ display:flex; }
  .nav-menu a{
    display:flex; align-items:center; gap:9px; padding:9px 10px; text-decoration:none; color:var(--text-dim);
    font-size:12.5px; font-weight:600; transition:background .1s ease, color .1s ease;
  }
  .nav-menu a:hover{ background:var(--surface-2); color:var(--text); }
  .nav-menu a:active{ transform:scale(.98); }
  .nav-menu a.current{ color:#000; background:#fff; }
  .nav-menu .menu-sep{ height:1px; background:var(--border); margin:5px 2px; }
  .nav-right{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    width:34px; height:34px; padding:0; background:var(--surface);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center; min-height:auto;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .lang-toggle{ display:flex; background:var(--surface); border:1px solid var(--border); padding:3px; gap:2px; }
  .lang-toggle button{
    border:none; background:none; color:var(--text-dim); font-family:var(--font-body); font-weight:600;
    font-size:12px; padding:6px 13px; cursor:pointer; min-height:auto;
  }
  .lang-toggle button.active{ background:#fff; color:#000; }

  .win{ background:var(--surface); border:1px solid var(--border); border-top:3px solid #FFD23F; }
  .win-title{
    font-family:var(--font-display); font-weight:600; color:var(--text); font-size:14px;
    padding:14px 18px; border-bottom:1px solid var(--border);
  }

  .tabs{ display:flex; border-bottom:1px solid var(--border); }
  .tab-btn{
    flex:none; padding:12px 18px; background:none; border:none; border-bottom:2px solid transparent;
    color:var(--text-dim); font-family:var(--font-body); font-weight:600; font-size:12.5px; cursor:pointer;
    min-height:auto;
  }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn.active{ color:#fff; border-bottom-color:#fff; }
  .tab-panel{ display:none; padding:18px; }
  .tab-panel.active{ display:block; }

  button{
    font-family:var(--font-body); font-weight:600; font-size:12px; padding:8px 14px; min-height:auto;
    border:1px solid var(--border); color:var(--text); cursor:pointer;

  button:hover{ border-color:var(--border-strong); background:var(--surface-3); }
  button:active{ transform:scale(.97); }
  button.primary{ background:#fff; border-color:transparent; color:#000; }
  button.primary:hover{ background:#e2e2e2; }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  input[type=file]{ display:none; }

  .drop{
    border:1.5px dashed var(--border-strong); padding:34px 16px; text-align:center;
    color:var(--text-dim); cursor:pointer; font-size:12.5px;
  }
  .drop:hover{ border-color:#fff; color:var(--text); }
  .extract-preview{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .extract-preview img{ max-width:140px; max-height:140px; border:1px solid var(--border); display:block; }
  .extract-status{ font-size:12px; color:var(--text-dim); }

  .gen-controls{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-bottom:16px; }
  .gen-row{ display:flex; flex-direction:column; gap:5px; }
  .gen-row label{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; }
  input[type=color]{
    width:44px; height:34px; padding:2px; background:var(--surface-2); border:1px solid var(--border); cursor:pointer;
  }
  select{
    font-family:var(--font-body); font-size:12px; padding:8px 10px; background:var(--surface-2);
    color:var(--text); border:1px solid var(--border); min-height:auto;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:120px; height:4px; background:var(--surface-3);
    border:1px solid var(--border); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:14px; background:#fff; cursor:pointer; border:1px solid #333;
  }
  .divider-text{ display:flex; align-items:center; gap:10px; color:var(--text-faint); font-size:11px; text-transform:uppercase; letter-spacing:.03em; margin:16px 0; }
  .divider-text::before, .divider-text::after{ content:''; flex:1; height:1px; background:var(--border); }

  .swatches{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-bottom:16px; }
  .swatch{ border:1px solid var(--border); background:var(--surface-2); cursor:pointer; overflow:hidden; position:relative; }
  .swatch-color{ height:80px; }
  .swatch-info{ padding:8px 9px; display:flex; align-items:center; justify-content:space-between; gap:6px; }

  .swatch-copied{ font-size:9.5px; color:var(--accent); opacity:0; transition:opacity .15s ease; }
  .swatch.copied .swatch-copied{ opacity:1; }
  .swatch:hover{ border-color:var(--border-strong); }

  .actions-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); z-index:80;
    background:#fff; color:#000; font-size:12px; font-weight:600; padding:10px 16px;
    opacity:0; transition:opacity .2s ease, transform .2s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .note{ font-size:11px; color:var(--text-faint); line-height:1.5; }
  .site-footer{ text-align:center; font-size:12px; color:var(--text-faint); padding:20px 0 6px; }
  .site-footer a{ color:var(--text-dim); text-decoration:underline; text-underline-offset:2px; }

  @media (max-width:600px){
    .swatches{ grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); }
    .extract-preview{ flex-direction:column; align-items:flex-start; }
  }
</style>

<script>
// ============================================================
// i18n
// ============================================================
const I18N = {
  en: {
    winTitle:'Color Palette',
    tabExtract:'Extract from Image', tabGenerate:'Generate',
    dropLine:'drop an image here, or click to choose',
    extracting:'Extracting colors…',
    randomPalette:'🎲 Random Palette', orCreateYours:'or create your own',
    baseColor:'Base color', harmony:'Harmony',
    hComplementary:'Complementary', hAnalogous:'Analogous', hTriadic:'Triadic',
    hSplitComp:'Split-complementary', hMonochromatic:'Monochromatic', hShades:'Shades',
    colorCount:'Colors: <span id="v-count">{n}</span>', generateBtn:'Generate',
    downloadPng:'Download PNG', copyAllHex:'Copy All Hex',
    copiedOne:'Copied {hex}', copiedAll:'Copied all hex codes!',
    terms:'Terms of Service',
  },
  es: {
    winTitle:'Paleta de Colores',
    tabExtract:'Extraer de una Imagen', tabGenerate:'Generar',
    dropLine:'soltá una imagen acá, o hacé clic para elegir',
    extracting:'Extrayendo colores…',
    randomPalette:'🎲 Paleta Aleatoria', orCreateYours:'o creá la tuya',
    baseColor:'Color base', harmony:'Armonía',
    hComplementary:'Complementaria', hAnalogous:'Análoga', hTriadic:'Triádica',
    hSplitComp:'Complementaria dividida', hMonochromatic:'Monocromática', hShades:'Tonos',
    colorCount:'Colores: <span id="v-count">{n}</span>', generateBtn:'Generar',
    downloadPng:'Descargar PNG', copyAllHex:'Copiar Todos los Hex',
    copiedOne:'Copiado {hex}', copiedAll:'¡Copiados todos los códigos!',
    terms:'Términos de servicio',
  }
};
const LANG_KEY = 'drIggyLang';
let LANG = (function(){ try{ return localStorage.getItem(LANG_KEY) || 'en'; }catch(e){ return 'en'; } })();
function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || key;
  if(vars) for(const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
function setLanguage(lang){ LANG = lang; try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){} applyLanguage(); }
function applyLanguage(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(I18N[LANG][key] !== undefined) el.textContent = I18N[LANG][key];
  });
  document.getElementById('btnLangEn').classList.toggle('active', LANG==='en');
  document.getElementById('btnLangEs').classList.toggle('active', LANG==='es');
  document.documentElement.lang = LANG;
  document.querySelector('label[data-i18n="colorCount"]').innerHTML = t('colorCount',{n: countSlider.value});
}
document.getElementById('btnLangEn').addEventListener('click', ()=> setLanguage('en'));
document.getElementById('btnLangEs').addEventListener('click', ()=> setLanguage('es'));
document.getElementById('btnFullscreen').addEventListener('click', ()=>{
  if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  else document.documentElement.requestFullscreen?.().catch(()=>{});
});

const btnMenu = document.getElementById('btnMenu');
const navMenu = document.getElementById('navMenu');
const menuBackdrop = document.getElementById('menuBackdrop');
function toggleMenu(open){
  const willOpen = open !== undefined ? open : !navMenu.classList.contains('open');
  navMenu.classList.toggle('open', willOpen);
  menuBackdrop.classList.toggle('open', willOpen);
  btnMenu.setAttribute('aria-expanded', String(willOpen));
}
btnMenu.addEventListener('click', ()=> toggleMenu());
menuBackdrop.addEventListener('click', ()=> toggleMenu(false));
document.addEventListener('keydown', e=>{ if(e.key==='Escape') toggleMenu(false); });

// ============================================================
// tabs
// ============================================================
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=> p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

// ============================================================
// toast
// ============================================================
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1600);
}
function copyText(str){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(str);
  const ta = document.createElement('textarea');
  ta.value = str; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  return Promise.resolve();
}

// ============================================================
// color math
// ============================================================
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(v=> Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0,s=0; const l=(max+min)/2;
  const d = max-min;
  if(d!==0){
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    if(max===r) h = ((g-b)/d + (g<b?6:0));
    else if(max===g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
  }
  return { h, s:s*100, l:l*100 };
}
function hslToRgb(h,s,l){
  h = ((h%360)+360)%360; s/=100; l/=100;
  const c = (1-Math.abs(2*l-1))*s;
  const x = c*(1-Math.abs((h/60)%2-1));
  const m = l-c/2;
  let r,g,b;
  if(h<60){ r=c;g=x;b=0; } else if(h<120){ r=x;g=c;b=0; } else if(h<180){ r=0;g=c;b=x; }
  else if(h<240){ r=0;g=x;b=c; } else if(h<300){ r=x;g=0;b=c; } else { r=c;g=0;b=x; }
  return { r:(r+m)*255, g:(g+m)*255, b:(b+m)*255 };
}
function hslToHex(h,s,l){ const {r,g,b} = hslToRgb(h,s,l); return rgbToHex(r,g,b); }

// ============================================================
// swatch rendering
// ============================================================
function renderSwatches(container, hexList){
  container.innerHTML = '';
  hexList.forEach(hex=>{
    const card = document.createElement('div');
    card.className = 'swatch';
    card.innerHTML = `
      <div class="swatch-color" style="background:${hex}"></div>
      <div class="swatch-info">
        <span class="swatch-hex">${hex.toUpperCase()}</span>
        <span class="swatch-copied">✓</span>
      </div>
    `;
    card.addEventListener('click', ()=>{
      copyText(hex.toUpperCase());
      card.classList.add('copied');
      setTimeout(()=> card.classList.remove('copied'), 900);
      showToast(t('copiedOne',{hex: hex.toUpperCase()}));
    });
    container.appendChild(card);
  });
}
function downloadPaletteImage(hexList, filename){
  const swW = 160, swH = 200, labelH = 40;
  const c = document.createElement('canvas');
  c.width = swW * hexList.length; c.height = swH;
  const ctx = c.getContext('2d');
  hexList.forEach((hex,i)=>{
    ctx.fillStyle = hex;
    ctx.fillRect(i*swW, 0, swW, swH-labelH);
    ctx.fillStyle = '#000';
    ctx.fillRect(i*swW, swH-labelH, swW, labelH);
    ctx.fillStyle = '#fff';
    ctx.font = '13px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(hex.toUpperCase(), i*swW + swW/2, swH-labelH/2+5);
  });
  c.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

const els = {
  fileInput: document.getElementById('fileInput'),

function handleImageFile(file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    document.getElementById('extractPreview').style.display = 'flex';
    document.getElementById('extractImg').src = url;
    document.getElementById('extractStatus').textContent = t('extracting');
    document.getElementById('extractSwatches').innerHTML = '';
    document.getElementById('extractActions').style.display = 'none';
    setTimeout(()=>{
      extractedHex = extractPalette(img, 6);
      renderSwatches(document.getElementById('extractSwatches'), extractedHex);
      document.getElementById('extractStatus').textContent = '';
      document.getElementById('extractActions').style.display = 'flex';
    }, 30);
  };
  img.src = url;
}

function extractPalette(img, k){
  const maxDim = 150;
  const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth*scale)), h = Math.max(1, Math.round(img.naturalHeight*scale));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const data = ctx.getImageData(0,0,w,h).data;
  const pixels = [];
  for(let i=0;i<data.length;i+=4){
    if(data[i+3] < 128) continue;
    pixels.push([data[i], data[i+1], data[i+2]]);
  }
  if(pixels.length === 0) return Array(k).fill('#888888');

  let centroids = [];
  const used = new Set();
  while(centroids.length < k && centroids.length < pixels.length){
    const idx = Math.floor(Math.random()*pixels.length);
    if(used.has(idx)) continue;
    used.add(idx);
    centroids.push(pixels[idx].slice());
  }
  let assignments = new Array(pixels.length).fill(0);
  for(let iter=0; iter<8; iter++){
    for(let p=0; p<pixels.length; p++){
      let best = 0, bestDist = Infinity;
      for(let ci=0; ci<centroids.length; ci++){
        const c0 = centroids[ci];
        const dr = pixels[p][0]-c0[0], dg = pixels[p][1]-c0[1], db = pixels[p][2]-c0[2];
        const dist = dr*dr+dg*dg+db*db;
        if(dist < bestDist){ bestDist = dist; best = ci; }
      }
      assignments[p] = best;
    }
    const sums = centroids.map(()=> [0,0,0,0]);
    for(let p=0; p<pixels.length; p++){
      const a = assignments[p];
      sums[a][0] += pixels[p][0]; sums[a][1] += pixels[p][1]; sums[a][2] += pixels[p][2]; sums[a][3]++;
    }
    centroids = centroids.map((c0,i)=> sums[i][3]>0 ? [sums[i][0]/sums[i][3], sums[i][1]/sums[i][3], sums[i][2]/sums[i][3]] : c0);
  }
  const counts = new Array(centroids.length).fill(0);
  assignments.forEach(a=> counts[a]++);
  const order = centroids.map((c0,i)=> ({c:c0, n:counts[i]})).sort((a,b)=> b.n-a.n);
  return order.map(o=> rgbToHex(o.c[0], o.c[1], o.c[2]));
}

let genHex = [];
const countSlider = document.getElementById('countSlider');
countSlider.addEventListener('input', ()=>{
  document.getElementById('v-count').textContent = countSlider.value;
});

function harmonyPalette(baseHex, type, count){
  const rgb = hexToRgb(baseHex);
  const {h,s,l} = rgbToHsl(rgb.r, rgb.g, rgb.b);
  let hues = [];
  if(type === 'complementary') hues = [h, h+180];
  else if(type === 'analogous') hues = [h-30, h-15, h, h+15, h+30];
  else if(type === 'triadic') hues = [h, h+120, h+240];
  else if(type === 'splitComp') hues = [h, h+150, h+210];
  else if(type === 'monochromatic') hues = [h];
  else if(type === 'shades') hues = [h];

  const out = [];
  if(type === 'monochromatic'){
    for(let i=0;i<count;i++){
      const ll = 20 + (i/(count-1||1)) * 60;
      out.push(hslToHex(h, s, ll));
    }
    return out;
  }
  if(type === 'shades'){
    for(let i=0;i<count;i++){
      const ss = Math.max(15, s - i*8);
      const ll = 30 + i*(45/(count-1||1));
      out.push(hslToHex(h, ss, ll));
    }
    return out;
  }
  for(let i=0;i<count;i++){
    const baseHue = hues[i % hues.length];
    const variation = Math.floor(i / hues.length);
    const ll = Math.max(25, Math.min(75, l + (variation%2===0? -1:1) * variation * 10));
    out.push(hslToHex(baseHue, s, ll));
  }
  return out;
}

function randomPalette(count){
  const baseHue = Math.random()*360;
  const scheme = Math.random();
  const out = [];
  for(let i=0;i<count;i++){
    let h;
    if(scheme < 0.34) h = baseHue + i*(360/count);
    else if(scheme < 0.67) h = baseHue + (i%2===0? 0 : 180) + i*6;
    else h = baseHue + i*30;
    const s = 55 + Math.random()*30;
    const l = 40 + Math.random()*30;
    out.push(hslToHex(h, s, l));
  }
  return out;
}

function showGenPalette(hexList){
  genHex = hexList;
  renderSwatches(document.getElementById('genSwatches'), genHex);
  document.getElementById('genActions').style.display = 'flex';
}

document.getElementById('btnRandom').addEventListener('click', ()=>{

});

});

document.getElementById('btnGenCopyAll').addEventListener('click', ()=>{
  copyText(genHex.map(h=>h.toUpperCase()).join(', '));
  showToast(t('copiedAll'));
});
