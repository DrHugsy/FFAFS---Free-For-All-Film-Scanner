name: Deploy to VM

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/app
            git pull
            docker stop driggys || true
            docker rm driggys || true
            docker build -t driggys .
            docker run -d --restart unless-stopped -p 80:8000 --env-file ./.env --name driggys driggys
